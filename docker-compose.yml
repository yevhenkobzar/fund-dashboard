services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "54329:5432"
    volumes:
      - desk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  desk_pg:
